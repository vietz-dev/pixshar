name: Release

# ============================================
# Commit-driven release. One workflow, no PAT.
#
# Flow:
#   dev:      merge a Conventional Commit to main (fix: → patch, feat: → minor)
#   release:  release-please opens a "chore: release <version>" PR that bumps
#             the root + three workspace package.json files, the Helm chart's
#             version + appVersion, and writes CHANGELOG.md
#   merge:    merging that PR tags v<version> and creates the GitHub Release.
#             release_created=true fans out to build images + package Helm.
#
# Everything runs in this single workflow, so the GITHUB_TOKEN
# "can't trigger another workflow" rule never bites us — no PAT needed.
# ============================================

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # release PR commit + create GitHub Release/tag
  pull-requests: write # open the release PR
  packages: write # push images + Helm chart to ghcr.io
  issues: write # release-please labels the release PR

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Build & Push ${{ matrix.name }} image
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pixshar-${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Package Helm
    needs: [release, images]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        run: helm package helm/pixshar

      - name: Push Helm chart to ghcr.io
        run: helm push pixshar-*.tgz oci://ghcr.io/${{ github.repository_owner }}
