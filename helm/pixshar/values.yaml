# --- Global settings ---
nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# --- Service Account ---
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

# --- Database ---
# Pixshar uses Postgres. Recommended: link an existing managed Postgres (CNPG,
# RDS, …) via `externalDatabase`. For quick testing the chart can also spin up a
# single-replica `pixshar-postgres` StatefulSet by setting `postgres.enabled`.
#
# Bundled fallback Postgres — disabled by default; prefer an external DB.
postgres:
  enabled: false
  image: postgres:17-alpine
  auth:
    username: pixshar
    database: pixshar
    # Used to create the chart-managed secret when enabled and no existingSecret.
    password: ""
    # Reference an existing secret holding key `password` instead of the above.
    existingSecret: ""
  persistence:
    size: 8Gi
    storageClass: ""
  resources: {}

# External Postgres (used when postgres.enabled=false — the recommended path).
externalDatabase:
  # Option A (preferred — CNPG / openBAO): pull a ready-made DSN from a Secret.
  # CNPG publishes a full `postgres://…` connection string under the "uri" key of
  # its "<cluster>-app" secret; point existingSecret at it and you're done.
  existingSecret: ""
  existingSecretUrlKey: "uri"
  # Option B: assemble the DSN from parts; password comes from a Secret key.
  # Set existingSecretUrlKey: "" to use this path.
  host: ""
  port: 5432
  database: pixshar
  username: pixshar
  existingSecretPasswordKey: "password"
  sslmode: require

# --- API ---
# The Pixshar API (Hono + Bun + Prisma + Postgres).
api:
  enabled: true
  image:
    repository: ghcr.io/pixshar/pixshar-api
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 3001

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    fsGroup: 1001

  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  livenessProbe:
    httpGet:
      path: /health
      port: api
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: api
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # Extra volumes for the API pod.
  extraVolumes: []
  extraVolumeMounts: []

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  # Zero-downtime rolling updates + PodDisruptionBudget. Disable for single-node
  # setups where multiple replicas are not possible (PDB requires ≥2 schedulable nodes).
  highAvailability:
    enabled: false
    # PodDisruptionBudget: minimum API pods that must remain available during
    # node drains and voluntary disruptions.
    minAvailable: 1
    # Seconds given to the pod to finish in-flight requests (incl. open SSE streams)
    # before the process is killed. Must be greater than preStopSleepSeconds.
    terminationGracePeriodSeconds: 60
    # Sleep injected before SIGTERM to let kube-proxy and the ingress controller
    # remove the pod from their endpoint lists. Prevents 502s during rollouts.
    preStopSleepSeconds: 5

# --- Image Processor ---
# Separate worker pool for image resizing and ZIP archive building.
# Uses the same Docker image as the API but starts worker.ts as entry point.
# Scale replicas or WORKER_CONCURRENCY to increase throughput without affecting API.
imageProcessor:
  enabled: true
  replicaCount: 1

  # Parallel jobs per pod. Total throughput = replicaCount × concurrency.
  concurrency: 2
  metricsPort: 4000

  podSecurityContext:
    fsGroup: 1001

  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # Workers are CPU + memory intensive; give them more headroom than the API.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- Web ---
# The Pixshar frontend (Next.js 15).
# Proxies /api/* to the API service internally.
web:
  enabled: true
  image:
    repository: ghcr.io/pixshar/pixshar-web
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 3000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    fsGroup: 1001

  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  livenessProbe:
    httpGet:
      path: /
      port: web
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /
      port: web
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  extraVolumes: []
  extraVolumeMounts: []

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

# --- Secrets ---
# All sensitive values are stored in a Kubernetes Secret.
# For production, create the secret manually and set existingSecret.
# For quick testing, the chart can create the secret from values.
secrets:
  existingSecret: ""
  betterAuthSecret: ""
  adminEmail: "admin@example.com"
  adminPassword: ""
  s3AccessKey: ""
  s3SecretKey: ""
  # 64 lowercase hex chars (32 bytes). Encrypts gallery passwords at rest.
  # Generate: openssl rand -hex 32
  galleryEncryptionKey: ""

# --- Config ---
# Non-sensitive configuration values are stored in a ConfigMap.
# The webUrl must be the public URL guests use to reach the app.
# The apiUrl is the public URL for BetterAuth callbacks.
config:
  webUrl: "https://pixshar.local"
  apiUrl: "https://pixshar.local/api"
  betterAuthUrl: "https://pixshar.local/api"
  s3Endpoint: "https://s3.amazonaws.com"
  s3Bucket: "pixshar"
  s3Region: "us-east-1"
  s3PublicUrl: ""
  # Host the browser uses for presigned URLs (direct-to-S3 upload + display).
  # Leave empty when s3Endpoint is already reachable from the browser. Set this
  # if the API talks to S3 over an in-cluster/internal host the browser can't.
  # NOTE: the S3 bucket must allow CORS (GET/PUT/HEAD) from your web origin for
  # browser uploads to succeed.
  s3PublicEndpoint: ""
  downloadDebounceSeconds: 600
  # Max size of a single gallery-archive part; larger galleries are split into
  # multiple ZIPs so guests never have to restart a >2GB download. 2 GiB.
  downloadMaxPartBytes: "2147483648"
  # Idle expiry — an archive nobody has downloaded for this many days has its ZIP
  # objects deleted from S3 and is rebuilt on demand from the preserved
  # membership. 0 disables expiry (archives live forever, as they used to).
  downloadArchiveTtlDays: 5
  # How often the expiry sweep looks for idle archives.
  downloadArchiveSweepSeconds: 3600

# --- Ingress ---
# The ingress routes all traffic to the web service.
# The web app proxies /api/* to the API service internally.
# If apiDirectRouting is true, /api/* is routed directly to the API
# service (bypassing the web proxy).
ingress:
  enabled: true
  className: nginx
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: pixshar.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: pixshar-tls
    #   hosts:
    #     - pixshar.local
  apiDirectRouting: true

# --- Prometheus ServiceMonitor ---
# Requires prometheus-operator (e.g. kube-prometheus-stack) to be installed.
# The `prometheusRelease` label must match the Prometheus Operator's serviceMonitorSelector.
serviceMonitor:
  enabled: false
  prometheusRelease: kube-prometheus-stack
  interval: 30s
  scrapeTimeout: 10s

# --- Grafana Dashboard ConfigMap ---
# Creates a ConfigMap labeled `grafana_dashboard: "1"` that the kube-prometheus-stack
# Grafana sidecar picks up automatically. Set to false to import the dashboard manually
# from helm/pixshar/dashboards/pixshar-overview.json via Grafana UI instead.
grafanaDashboard:
  enabled: false

# --- Gateway API HTTPRoute ---
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - pixshar.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
